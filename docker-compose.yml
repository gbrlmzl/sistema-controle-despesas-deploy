# Orquestra Postgres + API + front pra rodar os testes E2E (Cypress) contra o
# sistema completo. Os specs continuam vivendo no repo do front
# (sistema-controle-despesas-front/cypress) — este repositório só monta o
# ambiente onde eles rodam, não duplica código de teste.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_despesas_e2e}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sistema_despesas_e2e}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica as migrations uma vez e sai — mesmo padrão já usado no próprio
  # repo da API (nem a API nem o front devem migrar sozinhos ao subir).
  migrate:
    image: ${API_IMAGE:-ghcr.io/gbrlmzl/sistema-controle-despesas-api}:${API_IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sistema_despesas_e2e}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  # Imagem publicada pelo CI do próprio repo da API (ghcr.io) — não builda a
  # API a partir de código-fonte aqui, só consome o artefato já testado lá.
  api:
    image: ${API_IMAGE:-ghcr.io/gbrlmzl/sistema-controle-despesas-api}:${API_IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sistema_despesas_e2e}
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (mínimo 32 caracteres) — ver .env.example}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      # SEC-01 -> Tetos dos rate limiters da API, afrouxados só para esta stack.
      #
      # A API sobe com NODE_ENV=production de propósito (é a configuração que este e2e
      # existe pra validar), e nesse ambiente o RATE_LIMIT_DISABLED dela é ignorado de
      # propósito — ver src/config/env.ts no repo da API. E o navegador nunca fala com a
      # API direto: tudo passa pelo Route Handler do front
      # (front/src/app/api/[...path]/route.ts), então a suíte inteira se reparte em dois
      # IPs só — o gateway da rede, que o Next repassa no X-Forwarded-For das chamadas
      # vindas do navegador, e o próprio container do front nas chamadas server-side
      # dele (o proxy.ts renova a sessão a cada request). Dois baldes para 17 specs.
      #
      # Medido numa execução de controle desta stack, com os padrões: 45 respostas 429,
      # sendo 10 no registro (teto de 10/h — o 11º cy.cadastrarUsuario() é barrado), 21
      # no refresh (teto de 30/15min) e 14 no teto global (120/min). Resultado: 11 dos
      # 17 specs falhando, a maioria em /register. Com os valores abaixo, 20/20 passam.
      #
      # Trocar o número, e não desarmar: os limitadores continuam montados nas rotas e
      # o e2e continua atravessando o middleware de verdade. Desarmá-los exigiria rodar
      # a API fora de produção, que é exatamente o que este job não pode fazer.
      RATE_LIMIT_GLOBAL: 5000
      RATE_LIMIT_LOGIN: 500
      RATE_LIMIT_REGISTER: 500
      RATE_LIMIT_REFRESH: 500
      RATE_LIMIT_FORGOT_PASSWORD: 500
      RATE_LIMIT_RESET_PASSWORD: 500
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Buildada a partir do código-fonte (não da imagem publicada no GHCR).
  # Isso já não é por causa de resolução em build-time: desde 20/08/2026 o
  # rewrite /api/* -> API_URL saiu do next.config.ts e virou o Route Handler
  # em src/app/api/[...path]/route.ts, que lê process.env.API_URL a cada
  # requisição (mesmo padrão em src/lib/apiClient.ts e src/proxy.ts) — a
  # imagem publicada já aceita apontar pro serviço "api" desta rede em
  # runtime. Continua buildando aqui porque a imagem do front no GHCR ainda
  # não é multi-arch (só linux/arm64, como a da API): consumi-la sob QEMU só
  # trocaria a emulação de lugar. Quando ela publicar amd64 também, dá pra
  # trocar para `image: .../sistema-controle-despesas-front:${FRONT_IMAGE_TAG:-latest}`
  # com API_URL: http://api:8080 em runtime, fechando "build once, promote
  # everywhere" pro front do mesmo jeito que já vale pra API.
  front:
    build:
      context: ${FRONT_CONTEXT:-../sistema-controle-despesas-front}
      args:
        API_URL: http://api:8080
    environment:
      NODE_ENV: production
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
