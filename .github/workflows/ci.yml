name: E2E

# Três formas de disparo:
# - push/PR neste repo: testa main/HEAD dos dois lados (ex.: mudou o
#   docker-compose.yml aqui).
# - repository_dispatch "front-published"/"api-published": disparado pelo CI
#   do front ou da API logo depois de publicar uma imagem no GHCR, testando
#   exatamente o SHA/tag que acabou de ser publicado (build once, promote
#   everywhere — nunca rebuilda pra produção aqui, só valida e promove o que
#   já foi buildado nos repos de origem).
# - workflow_dispatch manual, com os mesmos parâmetros pra reproduzir um
#   cenário específico.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      front_ref:
        description: "Branch/SHA do front a testar"
        required: false
        default: main
      front_image_tag:
        description: "Tag da imagem do front (GHCR) a testar"
        required: false
        default: stable
      api_image_tag:
        description: "Tag da imagem da API (GHCR) a testar"
        required: false
        default: stable
  repository_dispatch:
    types: [front-published, api-published]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orquestrador
        uses: actions/checkout@v4

      - name: Resolver parâmetros do trigger
        id: params
        # Valores de client_payload chegam via env, não interpolados direto
        # no run: — evita que um payload malformado seja lido como shell.
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          DISPATCH_IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
          INPUT_FRONT_REF: ${{ inputs.front_ref }}
          INPUT_FRONT_IMAGE_TAG: ${{ inputs.front_image_tag }}
          INPUT_API_IMAGE_TAG: ${{ inputs.api_image_tag }}
        run: |
          case "${{ github.event_name }}" in
            repository_dispatch)
              if [ "${{ github.event.action }}" = "front-published" ]; then
                echo "front_ref=$DISPATCH_SHA"             >> "$GITHUB_OUTPUT"
                echo "front_image_tag=$DISPATCH_IMAGE_TAG" >> "$GITHUB_OUTPUT"
                echo "api_image_tag=stable"                >> "$GITHUB_OUTPUT"
              else
                echo "front_ref=main"                      >> "$GITHUB_OUTPUT"
                echo "front_image_tag=stable"              >> "$GITHUB_OUTPUT"
                echo "api_image_tag=$DISPATCH_IMAGE_TAG"   >> "$GITHUB_OUTPUT"
              fi
              ;;
            workflow_dispatch)
              echo "front_ref=$INPUT_FRONT_REF" >> "$GITHUB_OUTPUT"
              echo "front_image_tag=$INPUT_FRONT_IMAGE_TAG" >> "$GITHUB_OUTPUT"
              echo "api_image_tag=$INPUT_API_IMAGE_TAG" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "front_ref=main" >> "$GITHUB_OUTPUT"
              echo "front_image_tag=stable" >> "$GITHUB_OUTPUT"
              echo "api_image_tag=stable" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Os specs do Cypress vivem no repo do front, não aqui.
      - name: Checkout front (no ref sendo testado)
        uses: actions/checkout@v4
        with:
          repository: gbrlmzl/sistema-controle-despesas-front
          ref: ${{ steps.params.outputs.front_ref }}
          path: front

      - name: Gerar .env efêmero (só para este job)
        run: |
          cat <<EOF > .env
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=sistema_despesas_e2e
          JWT_SECRET=$(openssl rand -hex 32)
          API_IMAGE_TAG=${{ steps.params.outputs.api_image_tag }}
          FRONT_IMAGE_TAG=${{ steps.params.outputs.front_image_tag }}
          EOF

      # O pacote ghcr.io/gbrlmzl/sistema-controle-despesas-api é privado — sem
      # login, o "docker compose up" abaixo falha ao puxar a imagem da api/
      # migrate com "unauthorized". Reaproveita o mesmo PAT do job promote
      # (write:packages já cobre leitura).
      - name: Login no GHCR (imagem da API é privada)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PROMOTE_TOKEN }}

      # A imagem da API publicada no GHCR é linux/arm64 puro (único destino de
      # deploy é uma instância Graviton), mas o runner é amd64. Sem o QEMU
      # registrado no binfmt, os containers "api" e "migrate" são criados e
      # morrem no exec — o sintoma é o migrate saindo com 255 e o compose
      # abortando antes de qualquer spec rodar.
      - name: Registrar QEMU (a imagem da API é arm64, o runner é amd64)
        uses: docker/setup-qemu-action@v3

      - name: Subir a stack (postgres + api + front) e aguardar health
        run: docker compose up -d --wait

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependências do front (para rodar o Cypress)
        working-directory: front
        run: npm ci

      - name: Rodar os specs E2E contra a stack orquestrada
        working-directory: front
        run: npx cypress run --config baseUrl=http://localhost:3000

      - name: Logs da stack (se algo falhar)
        if: failure()
        run: docker compose logs

      # Sem isso, uma falha só diz "o spec não passou" — os screenshots (e
      # vídeos, se o cypress.config estiver com video: true) são o que
      # distingue timeout puro, erro devolvido pela API, ou o front sem
      # conseguir falar com a API (cai num error boundary com o texto "Não
      # foi possível carregar esta página"). Ficam só no runner e somem
      # quando o job termina se não forem subidos como artefato.
      - name: Upload de evidências de falha do Cypress
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failure-evidence
          path: |
            front/cypress/screenshots
            front/cypress/videos
          if-no-files-found: ignore
          retention-days: 7

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v

  promote:
    name: Promover artefato testado
    needs: e2e
    # Só faz sentido "promover" quando o gatilho foi a publicação de um
    # artefato específico (front ou API). Em push/PR/workflow_dispatch
    # manual não há um artefato recém-publicado pra marcar como validado.
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN só tem permissão sobre pacotes deste repo — promover
      # imagens publicadas em ghcr.io/gbrlmzl/sistema-controle-despesas-front
      # e .../sistema-controle-despesas-api exige um PAT com write:packages
      # nesses dois repos, guardado aqui como GHCR_PROMOTE_TOKEN.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PROMOTE_TOKEN }}

      # imagetools create só re-taggeia o manifesto já publicado (sem baixar
      # e reenviar camadas) — é exatamente o mesmo artefato que passou no e2e.
      - name: Promover imagem da API (tag testada -> :stable)
        if: github.event.action == 'api-published'
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/gbrlmzl/sistema-controle-despesas-api:stable \
            "ghcr.io/gbrlmzl/sistema-controle-despesas-api:$IMAGE_TAG"

          docker buildx imagetools create \
            --tag ghcr.io/gbrlmzl/sistema-controle-despesas-api-migrate:stable \
            "ghcr.io/gbrlmzl/sistema-controle-despesas-api-migrate:$IMAGE_TAG"

      - name: Promover imagem do front (tag testada -> :stable)
        if: github.event.action == 'front-published'
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/gbrlmzl/sistema-controle-despesas-front:stable \
            "ghcr.io/gbrlmzl/sistema-controle-despesas-front:$IMAGE_TAG"

  mirror:
    name: Espelhar imagem aprovada no ECR
    needs: promote
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Normalizar a tag imutável
        id: tag
        env:
          DISPATCH_IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
        run: echo "image_tag=$DISPATCH_IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PROMOTE_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-mirror
          aws-region: us-east-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # imagetools copia manifesto e camadas entre registries diferentes sem
      # materializar a imagem no runner. Duas tags no destino: a de SHA, que é
      # imutável e vai para a task definition, e :stable, que é só um rótulo
      # legível de "o que está aprovado agora".
      - name: Espelhar API (+ migrate)
        if: github.event.action == 'api-published'
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          for repo in sistema-controle-despesas-api sistema-controle-despesas-api-migrate; do
            dest="${repo/sistema-controle-despesas/sistema-despesas}"
            docker buildx imagetools create \
              --tag "$REG/$dest:$TAG" \
              --tag "$REG/$dest:stable" \
              "ghcr.io/gbrlmzl/$repo:stable"
          done

      - name: Espelhar front
        if: github.event.action == 'front-published'
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            --tag "$REG/sistema-despesas-front:$TAG" \
            --tag "$REG/sistema-despesas-front:stable" \
            "ghcr.io/gbrlmzl/sistema-controle-despesas-front:stable"

  deploy:
    name: Deploy em producao
    needs: mirror
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-2
      CLUSTER: ec2-sistema-despesas
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: us-east-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # A fonte da verdade da task definition continua sendo a AWS: baixa a
      # revisão ativa, troca só o campo "image" do container, registra. Os
      # campos removidos pelo "del" são read-only — register-task-definition
      # rejeita o JSON se eles vierem junto.
      - name: Registrar revisao nova
        id: td
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ needs.mirror.outputs.image_tag }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ "$ACTION" = "api-published" ]; then
            FAMILY=cronos-app;   CONTAINER=api;   REPO=sistema-despesas-api
          else
            FAMILY=cronos-front; CONTAINER=front; REPO=sistema-despesas-front
          fi
          echo "family=$FAMILY" >> "$GITHUB_OUTPUT"

          aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query taskDefinition > td.json

          jq --arg img "$REG/$REPO:$TAG" --arg c "$CONTAINER" '
            (.containerDefinitions[] | select(.name == $c) | .image) = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' td.json > td-new.json

          ARN=$(aws ecs register-task-definition --cli-input-json file://td-new.json \
                  --query "taskDefinition.taskDefinitionArn" --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "Revisao registrada: $ARN"

      # Migration só quando a API mudou, e sempre ANTES do update-service — é a
      # tradução do depends_on: service_completed_successfully do compose.
      - name: Aplicar migrations
        if: github.event.action == 'api-published'
        env:
          TD: ${{ steps.td.outputs.arn }}
        run: |
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TD" --launch-type EC2 \
            --overrides '{"containerOverrides":[{"name":"api","command":["npx","prisma","migrate","deploy"]}]}' \
            --query "tasks[0].taskArn" --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
                   --query "tasks[0].containers[0].exitCode" --output text)
          echo "migrate exitCode=$CODE"
          [ "$CODE" = "0" ] || { aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK"; exit 1; }

      - name: Atualizar o service
        env:
          FAMILY: ${{ steps.td.outputs.family }}
          TD: ${{ steps.td.outputs.arn }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$FAMILY" --task-definition "$TD"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$FAMILY"

      - name: Eventos do service (se algo falhar)
        if: failure()
        env:
          FAMILY: ${{ steps.td.outputs.family }}
        run: aws ecs describe-services --cluster "$CLUSTER" --services "$FAMILY" --query "services[].events[:15]"
